; MiscElement.ini - 疑难类 X-01~X-04 元素定位

[X01]
account=css>input[placeholder='请输入渠道账号']
password=css>input[placeholder='请输入登录密码']
captcha=css>input[placeholder='请输入验证码']
cap_img=css>img.cap-img
refresh_btn=xpath>//button[contains(.,'看不清，换一张')]
login_btn=xpath>//button[contains(.,'登')]

[X02]
check_btn=xpath>//button[contains(.,'执行环境校验')]
gen_summary=xpath>//button[contains(.,'生成当日数据摘要')]
env_tag=css>.el-tag
block_tip=css>.block-tip
detect_mono=css>.detect-card .mono
result_verdict=css>.detect-card .kv:nth-child(2) b

[X03]
login_account=css>input[placeholder='tester 或 demo']
login_password=css>input[placeholder='请输入密码']
remember=xpath>//label[contains(@class,'el-checkbox')][contains(.,'记住登录状态')]
login_btn=xpath>//button[contains(.,'登录')]
recheck_btn=xpath>//button[contains(.,'重新检测登录态')]
do_biz=xpath>//button[contains(.,'生成当日运营快照')]
logout_btn=xpath>//button[contains(.,'退出登录')]

[X04]
biz_name=css>input[placeholder='如：退款复核 / 促销对账']
gen_btn=xpath>//button[contains(.,'生成工单编号')]
gen_id=css>.gen-result .mono
archive_btn=xpath>//button[contains(.,'归档此工单')]
load_all=xpath>//button[contains(.,'查询服务端已生成数据')]
