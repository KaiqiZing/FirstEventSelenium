; InteractElement.ini - 页面交互类 I-01~I-18 元素定位
; Section 名 = 场景码，格式: key=css>选择器 或 key=xpath>XPath（by 缺省为 xpath）

[I01]
operator=css>input[placeholder='请输入交接操作人']
note=css>textarea[placeholder='请输入交接说明']
agree=xpath>//label[contains(@class,'el-checkbox')][contains(.,'我已阅读并同意')]
save_btn=xpath>//button[contains(@class,'el-button--primary')][contains(.,'保存交接记录')]
disabled_btn=css>button.is-disabled
collapse_adv=xpath>//div[contains(@class,'el-collapse-item__header')][contains(.,'展开查看高级配置')]
reviewer=css>input[placeholder='请输入审核人']
apply_adv=xpath>//button[contains(.,'应用高级配置')]

[I02]
gen_btn=xpath>//button[contains(.,'生成对账结果')]
mask=css>.stage .mask
download_btn=xpath>//button[contains(.,'下载对账结果')]

[I03]
auto_switch=css>.el-switch
manual_refresh=xpath>//button[contains(.,'手动刷新')]
table_body=css>.el-table__body
row_view=xpath>//tr[contains(.,'T-1001')]//button[contains(.,'查看')]

[I04]
frame_a=css>iframe[title='报销入口框架']
frame_b=css>#innerFrame
mark_btn=css>#markBtn
reason=css>#reason
amount=css>#amount
dept=css>#dept
submit=css>#submitBtn
main_log_btn=xpath>//button[contains(.,'登记本页处理记录')]

[I05]
shadow_host=css>#shadowBox
read_state=xpath>//button[contains(.,'读取影子节点状态')]
outer_input=css>input.sinp
outer_btn=css>button.sbtn
outer_state=css>p.sst

[I06]
asset_no=css>input[placeholder='请输入资产编号']
asset_name=css>input[placeholder='请输入资产名称']
submit_btn=xpath>//button[.='提交资产信息']
regen_btn=xpath>//button[contains(.,'重新生成控件属性')]

[I07]
region=xpath>(//select[contains(@class,'native-select')])[1]
period=xpath>(//select[contains(@class,'native-select')])[2]
query_native=xpath>//button[contains(.,'按原生条件查询')]
biz_trigger=xpath>//div[contains(@class,'el-select')][.//span[contains(.,'请选择业务类型')]]
scope_trigger=xpath>//div[contains(@class,'el-select')][.//span[contains(.,'请选择门店范围')]]
query_biz=xpath>//button[contains(.,'按业务组件条件查询')]

[I08]
drop_trigger=css>.nav-item.drop .drop-trigger
drop_batch=xpath>//div[contains(@class,'drop-menu')]//button[.='批量打标签']
customer_row=xpath>//div[contains(@class,'c-row')][contains(.,'C-88121')]
row_edit=xpath>//div[contains(@class,'c-row')][contains(.,'C-88121')]//button[.='编辑']

[I09]
cand_drop=css>.zone:nth-of-type(1) .zone-body
picked_drop=css>.zone:nth-of-type(2) .zone-body
chip=css>.zone:nth-of-type(1) .chip[draggable='true']
commit=xpath>//button[contains(.,'确认分配')]
reset=xpath>//button[contains(.,'重置分配')]

[I10]
file_input=css>#contractFile
file_label=css>label[for='contractFile']
submit_reg=xpath>//button[contains(.,'提交登记')]

[I11]
alert_btn=xpath>//tr[contains(.,'SKU-23891')]//button[contains(.,'查看告警')]
confirm_btn=xpath>//tr[contains(.,'SKU-23892')]//button[contains(.,'确认补货')]
prompt_btn=xpath>//tr[contains(.,'SKU-23893')]//button[contains(.,'登记备注')]

[I12]
title=css>input[placeholder='请输入公告标题']
editor=css>.ed-area[contenteditable='true']
bold=css>button[title='加粗']
publish=xpath>//button[contains(.,'发布公告')]

[I13]
open_panel=xpath>//button[contains(.,'打开最新推送')]
slide_panel=css>.slide-panel
confirm_btn=xpath>//button[contains(.,'我知道了')]

[I14]
scroll_box=css>.scroll-box
more_tip=css>.more-tip
load_text=xpath>//p[contains(@class,'p-sub')][contains(.,'已加载')]
reset_btn=xpath>//button[contains(.,'回到第一页')]

[I15]
expand_btn=xpath>//button[contains(.,'展开完整区域')]
target_dot=css>button.target-dot
inspect_btn=xpath>//button[contains(.,'获取目标点位坐标')]

[I16]
cust_input=css>input[placeholder='请输入客户名称']
type_trigger=xpath>//div[contains(@class,'el-select')][.//span[contains(.,'请选择工单类型')]]
submit_ticket=xpath>//button[contains(.,'校验并提交')]
kw_input=css>input[placeholder='输入关键词，如：发票']
suggest_item=css>.suggest .suggest-item
search_btn=xpath>//button[contains(.,'搜索')]
remark=css>textarea[placeholder='请输入处理备注']
clear_remark=xpath>//button[contains(.,'清空备注')]

[I17]
; 结算单父子金额勾稽：树形行平铺，父子同名金额列只能靠 level class 区分
parent_row=xpath>//tr[contains(@class,'el-table__row--level-0')]
child_row=xpath>//tr[contains(@class,'el-table__row--level-1')]
expand_icon=css>.el-table__expand-icon
expand_all=xpath>//button[contains(.,'展开全部')]
collapse_all=xpath>//button[contains(.,'收起全部')]
reset_btn=xpath>//button[contains(.,'重置数据')]
edit_input=css>.edit-input input
save_btn=xpath>//button[contains(.,'保存')]
cell_amount=css>span.amount
cell_state=css>span.tag
cell_child_total=css>span.sub
summary_child=xpath>//div[contains(@class,'sum-item')][contains(.,'子单金额合计')]//span[contains(@class,'sum-value')]
summary_declared=xpath>//div[contains(@class,'sum-item')][contains(.,'父单申报合计')]//span[contains(@class,'sum-value')]
summary_diff=xpath>//div[contains(@class,'sum-item')][contains(.,'勾稽差额')]//span[contains(@class,'sum-value')]

[I18]
; 页面数字 与 数据库一致性核对：明细分页 / 库以「分」存储 / 汇总字段漂移 / NULL 未清算
refresh_btn=xpath>//button[contains(.,'刷新数据')]
open_db_btn=xpath>//button[contains(.,'数据库查询')]
post_btn=xpath>//button[contains(.,'模拟清算入账')]
reset_btn=xpath>//button[contains(.,'重置数据')]
; 第 1 个 panel = 结算明细（分页），第 2 个 panel = 资金账户
detail_rows=xpath>//section[contains(@class,'panel')][1]//tr[contains(@class,'el-table__row')]
detail_row=xpath>//section[contains(@class,'panel')][1]//tr[contains(@class,'el-table__row')][.//span[contains(@class,'mono')][normalize-space(.)='{item}']]
account_rows=xpath>//section[contains(@class,'panel')][2]//tr[contains(@class,'el-table__row')]
account_row=xpath>//section[contains(@class,'panel')][2]//tr[contains(@class,'el-table__row')][.//span[contains(@class,'mono')][normalize-space(.)='{account}']]
; 金额单元格 / 行内编辑与行内按钮（相对 tr 使用）
cell_amount=css>span.amount
edit_input=css>.edit-input input
row_adjust=xpath>.//button[contains(.,'调整')]
row_save=xpath>.//button[contains(.,'保存')]
row_recap=xpath>.//button[contains(.,'重算汇总')]
account_cell=xpath>.//td[{idx}]
; 分页器：页码列表 / 当前页码 / 指定页码
pager_numbers=css>ul.el-pager li.number
pager_active=css>ul.el-pager li.is-active
pager_item=xpath>//ul[contains(@class,'el-pager')]//li[contains(@class,'number')][normalize-space(.)='{no}']
; 汇总卡（结算单汇总字段合计 / 明细条数 / 资金账户可用与冻结合计）
summary_total=xpath>//div[contains(@class,'sum-item')][contains(.,'结算单汇总金额合计')]//span[contains(@class,'sum-value')]
summary_count=xpath>//div[contains(@class,'sum-item')][contains(.,'明细条数')]//span[contains(@class,'sum-value')]
summary_available=xpath>//div[contains(@class,'sum-item')][contains(.,'资金账户可用合计')]//span[contains(@class,'sum-value')]
summary_frozen=xpath>//div[contains(@class,'sum-item')][contains(.,'资金账户冻结合计')]//span[contains(@class,'sum-value')]
; 数据快照时间（陈旧读数对比锚点）
snapshot=css>.snap
; 数据库查询弹窗
dialog=xpath>//div[contains(@class,'el-overlay')]//div[contains(@class,'el-dialog')]
db_select=css>.db-select
db_query_btn=xpath>//div[contains(@class,'el-dialog')]//button[contains(.,'查询')]
db_path=css>.db-path
db_rows=xpath>//div[contains(@class,'el-dialog')]//tr[contains(@class,'el-table__row')]
dialog_close=xpath>//div[contains(@class,'el-dialog')]//button[contains(@class,'el-dialog__headerbtn')]
