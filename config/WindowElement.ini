; WindowElement.ini - 多窗口/多标签类 M-01~M-04 元素定位

[M01]
bill_link=css>a.bill-link
open_blank=xpath>//button[contains(.,'通过脚本打开')]
detail_billno=css>#billNo

[M02]
start_auth=xpath>//button[contains(.,'发起授权登录')]
auth_ok=css>b.text-ok
use_ticket=xpath>//button[contains(.,'使用授权票据查询')]

[M03]
open_win=xpath>//button[contains(.,'在新窗口处理申请')]
main_register=xpath>//button[contains(.,'登记主档')]
reason=css>#reason
amount=css>#amount
dept=css>#dept
submit=css>#submitBtn

[M04]
direct_btn=xpath>//button[contains(.,'立即预览')]
delayed_btn=xpath>//button[contains(.,'延时打开预览')]
counter_txt=xpath>//p[contains(.,'已成功打开预览')]
