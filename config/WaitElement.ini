; WaitElement.ini - 等待响应类 W-01~W-05 元素定位

[W01]
query_btn=xpath>//button[contains(.,'查询对账数据')]
loading_mask=css>.el-loading-mask
table_rows=css>.el-table__body tr

[W02]
tab_flow=xpath>//button[contains(@class,'tab-btn')][contains(.,'收支明细')]
view_card=css>.view-card strong

[W03]
start_btn=xpath>//button[contains(.,'发起导出')]
task_txt=css>.task-box .mono
progress_tag=css>.el-tag
download_link=css>a.dl-link

[W04]
content=css>input[placeholder='请输入本次处理内容']
save_btn=xpath>//button[contains(.,'保存')]
refresh_btn=xpath>//button[contains(.,'刷新已存记录')]
rec_list=css>.rec-list .rec

[W05]
sync_btn=xpath>//button[contains(.,'同步渠道数据')]
retry_btn=xpath>//button[contains(.,'重试一次')]
attempt_txt=xpath>//span[contains(.,'本次会话已尝试')]
result_table=css>.sync-result .el-table__body tr
