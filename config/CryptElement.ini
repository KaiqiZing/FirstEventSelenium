; CryptElement.ini - 数据加密类 E-01~E-04 元素定位
; 说明：本组场景的断言口径一律落到「服务端数据源 / 解密后的明文」，
; 页面文本（掩码）与库中密文都只能作为「不可直接相等」的反面证据。

[E01]
fingerprint=css>#pubkey-fingerprint
state_tag=css>.state-tag
reload_pubkey=css>#btn-reload-pubkey
account=css>#login-account
password=css>#login-password
submit_encrypted=css>#btn-submit-encrypted
submit_plain=css>#btn-submit-plain
request_body=css>#request-body
; 摘要比对区：服务端解密回传摘要 / 前端 Web Crypto 本地摘要 / 比对结论 / 掩码口令
; 说明：日志与响应体不再回显明文，稳定断言点改为「摘要相等」
server_digest=css>#server-digest
local_digest=css>#local-digest
digest_match=css>#digest-match
masked_password=css>#masked-password

[E02]
cust_row=css>tr.cust-row
row_by_id=css>tr.row-{id}
cell_mobile=css>span.cell-mobile
cell_idcard=css>span.cell-idcard
cell_balance=css>span.cell-balance
reveal_btn=css>#btn-reveal-{id}
refresh_btn=css>#btn-load-customers
raw_btn=css>#btn-server-raw
raw_row=css>tr.raw-row
raw_mobile=css>span.raw-mobile
raw_balance=css>span.raw-balance
drawer=css>.el-drawer
drawer_close=css>.el-drawer__close-btn
reveal_mobile=css>#reveal-mobile
reveal_idcard=css>#reveal-idcard
reveal_balance=css>#reveal-balance
reveal_countdown=css>#reveal-countdown

[E03]
vault_row=css>tr.vault-row
cell_val=css>span.cell-val
page_prev=css>#btn-page-prev
page_next=css>#btn-page-next
db_query_btn=css>#btn-db-query
db_meta_btn=css>#btn-db-meta
db_meta_text=css>p.tiny
raw_row=css>tr.raw-row
cipher_cell=css>span.cipher
write_custno=css>#write-custno
write_name=css>#write-name
write_mobile=css>#write-mobile
write_balance=css>#write-balance
write_btn=css>#btn-write
decrypt_input=css>#decrypt-input
decrypt_iv=css>#decrypt-iv
keyversion_select=css>#decrypt-keyversion .el-select__wrapper
decrypt_btn=css>#btn-decrypt
reset_btn=css>#btn-vault-reset
decrypt_output=css>#decrypt-output

[E04]
mode_radio=xpath>//label[contains(@class,'el-radio')][contains(normalize-space(.),'{mode}')]
fetch_btn=css>#btn-fetch-envelope
verify_btn=css>#btn-verify-envelope
envelope_ts=css>#envelope-ts
envelope_sign=css>#envelope-sign
envelope_enc=css>#envelope-enc
envelope_iv=xpath>//span[contains(@class,'k')][normalize-space()='IV']/following-sibling::span[1]
env_row=css>tr.env-row
env_amount=css>span.env-amount
